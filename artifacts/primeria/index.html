    <style>
      /* Prevent pull-to-refresh and address-bar bounce on iOS/Android */
      html, body {
        overscroll-behavior: none;
        overflow: hidden;
        height: 100%;
        background: #060606;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        if (!("serviceWorker" in navigator)) return;
        var host = location.hostname;
        var isDev =
          host === "localhost" ||
          host === "127.0.0.1" ||
          host.endsWith(".replit.dev") ||
          host.endsWith(".repl.co");
        if (isDev) {
          // Development preview: never let a cached service worker serve stale
          // code. Tear down any existing SW + caches so edits always show.
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) { caches.delete(k); });
            });
          }
          return;
        }
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").then(function (reg) {
            reg.addEventListener("updatefound", function () {
              var sw = reg.installing;
              if (!sw) return;
              sw.addEventListener("statechange", function () {
                if (sw.state === "installed" && navigator.serviceWorker.controller) {
                  // A new version is ready. Let it take over on the next natural
                  // load — do NOT force window.location.reload() here, which would
                  // reset the player to the title screen mid-session.
                  sw.postMessage({ type: "SKIP_WAITING" });
                }
              });
            });
          });
        });
      })();
    </script>
  </body>
</html>
